[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yc-launch-monitor"
version = "1.0.0"
description = "Stateful YC and Speedrun launch monitor with early founder alerts"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10",
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=1.70",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "slack-sdk>=3.33",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/yc_monitor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
